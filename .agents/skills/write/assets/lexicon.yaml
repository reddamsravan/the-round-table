# Plain English Lexicon & Transformation Registry
version: "1.0.0"
dialect: "Plain English"
standard: "Plain English (Plain Writing Act & Federal Guidelines)"

# Direct word substitutions: complex / bureaucratic terms -> simple Plain English equivalents
substitutions:
  - term: "utilize"
    replacement: "use"
  - term: "utilization"
    replacement: "use"
  - term: "commence"
    replacement: "start"
  - term: "terminate"
    replacement: "end"
  - term: "facilitate"
    replacement: "help"
  - term: "implement"
    replacement: "build"
  - term: "implementation"
    replacement: "setup"
  - term: "demonstrate"
    replacement: "show"
  - term: "transmit"
    replacement: "send"
  - term: "ascertain"
    replacement: "find out"
  - term: "discontinue"
    replacement: "stop"
  - term: "endeavor"
    replacement: "try"
  - term: "expedite"
    replacement: "speed up"
  - term: "furnish"
    replacement: "give"
  - term: "initiate"
    replacement: "start"
  - term: "modify"
    replacement: "change"
  - term: "modification"
    replacement: "change"
  - term: "obtain"
    replacement: "get"
  - term: "procure"
    replacement: "buy"
  - term: "prior to"
    replacement: "before"
  - term: "subsequent to"
    replacement: "after"
  - term: "in order to"
    replacement: "to"
  - term: "in the event that"
    replacement: "if"
  - term: "at this point in time"
    replacement: "now"
  - term: "due to the fact that"
    replacement: "because"
  - term: "in light of the fact that"
    replacement: "because"
  - term: "with regard to"
    replacement: "about"
  - term: "with respect to"
    replacement: "about"
  - term: "for the purpose of"
    replacement: "to"
  - term: "in accordance with"
    replacement: "following"
  - term: "is able to"
    replacement: "can"
  - term: "has the ability to"
    replacement: "can"
  - term: "shall be responsible for"
    replacement: "handles"
  - term: "a number of"
    replacement: "many"
  - term: "a majority of"
    replacement: "most"
  - term: "at an early date"
    replacement: "soon"
  - term: "by means of"
    replacement: "by"

# Smothered verbs / nominalizations -> direct active verbs
nominalizations:
  - phrase: "make a determination"
    replacement: "decide"
  - phrase: "conduct an investigation"
    replacement: "investigate"
  - phrase: "give consideration to"
    replacement: "consider"
  - phrase: "reach a conclusion"
    replacement: "conclude"
  - phrase: "perform an analysis"
    replacement: "analyze"
  - phrase: "provide assistance to"
    replacement: "help"
  - phrase: "make an assumption"
    replacement: "assume"
  - phrase: "bring about a reduction"
    replacement: "reduce"
  - phrase: "make an examination of"
    replacement: "examine"
  - phrase: "take action"
    replacement: "act"
  - phrase: "provide a description of"
    replacement: "describe"
  - phrase: "give an explanation of"
    replacement: "explain"
  - phrase: "make a recommendation"
    replacement: "recommend"
  - phrase: "reach an agreement"
    replacement: "agree"

# Throat-clearing and fluff phrases to eliminate completely
fluff_phrases:
  - "it is important to note that"
  - "it should be noted that"
  - "please be advised that"
  - "it is interesting to note that"
  - "it goes without saying that"
  - "as a matter of fact"
  - "for all intents and purposes"
  - "in the final analysis"
  - "needless to say"
  - "all things being equal"

# Agentic ACE unwrapping mappings
ace_unwrapping:
  contract_blocks:
    GIVEN: "Context: When starting with"
    WHEN: "Action: When"
    THEN: "Result: Then"
    INVARIANT: "Rule: Always / Never"
  modals:
    SHALL: "will or present tense active verb"
    SHALL NOT: "does not or must not"
    MUST: "must or needs to"
    MUST NOT: "must not"
