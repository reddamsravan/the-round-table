# Prose Lexicon & Registry (ASD-STE100 & Attempto Controlled English)
version: "1.0.0"

ste:
  dialect: "ASD-STE100 (Simplified Technical English)"
  substitutions:
    - term: "utilize"
      replacement: "use"
    - term: "utilization"
      replacement: "use"
    - term: "commence"
      replacement: "start"
    - term: "terminate"
      replacement: "end"
    - term: "facilitate"
      replacement: "help"
    - term: "implement"
      replacement: "build"
    - term: "implementation"
      replacement: "setup"
    - term: "demonstrate"
      replacement: "show"
    - term: "transmit"
      replacement: "send"
    - term: "ascertain"
      replacement: "find out"
    - term: "discontinue"
      replacement: "stop"
    - term: "endeavor"
      replacement: "try"
    - term: "expedite"
      replacement: "speed up"
    - term: "furnish"
      replacement: "give"
    - term: "initiate"
      replacement: "start"
    - term: "modify"
      replacement: "change"
    - term: "modification"
      replacement: "change"
    - term: "obtain"
      replacement: "get"
    - term: "procure"
      replacement: "buy"
    - term: "prior to"
      replacement: "before"
    - term: "subsequent to"
      replacement: "after"
    - term: "in order to"
      replacement: "to"
    - term: "in the event that"
      replacement: "if"
    - term: "at this point in time"
      replacement: "now"
    - term: "due to the fact that"
      replacement: "because"
    - term: "in light of the fact that"
      replacement: "because"
    - term: "with regard to"
      replacement: "about"
    - term: "with respect to"
      replacement: "about"
    - term: "for the purpose of"
      replacement: "to"
    - term: "in accordance with"
      replacement: "following"
    - term: "is able to"
      replacement: "can"
    - term: "has the ability to"
      replacement: "can"
    - term: "shall be responsible for"
      replacement: "handles"
    - term: "a number of"
      replacement: "many"
    - term: "a majority of"
      replacement: "most"
    - term: "at an early date"
      replacement: "soon"
    - term: "by means of"
      replacement: "by"

  nominalizations:
    - phrase: "make a determination"
      replacement: "decide"
    - phrase: "conduct an investigation"
      replacement: "investigate"
    - phrase: "give consideration to"
      replacement: "consider"
    - phrase: "reach a conclusion"
      replacement: "conclude"
    - phrase: "perform an analysis"
      replacement: "analyze"
    - phrase: "provide assistance to"
      replacement: "help"
    - phrase: "make an assumption"
      replacement: "assume"
    - phrase: "bring about a reduction"
      replacement: "reduce"
    - phrase: "make an examination of"
      replacement: "examine"
    - phrase: "take action"
      replacement: "act"
    - phrase: "provide a description of"
      replacement: "describe"
    - phrase: "give an explanation of"
      replacement: "explain"
    - phrase: "make a recommendation"
      replacement: "recommend"
    - phrase: "reach an agreement"
      replacement: "agree"

  fluff_phrases:
    - "it is important to note that"
    - "it should be noted that"
    - "please be advised that"
    - "it is interesting to note that"
    - "it goes without saying that"
    - "as a matter of fact"
    - "for all intents and purposes"
    - "in the final analysis"
    - "needless to say"
    - "all things being equal"

ace:
  dialect: "Attempto Controlled English (ACE)"
  contract_keywords:
    - "GIVEN"
    - "WHEN"
    - "THEN"
    - "INVARIANT"
    - "PRECONDITION"
    - "POSTCONDITION"

  modal_keywords:
    allowed:
      - "SHALL"
      - "SHALL NOT"
      - "MUST"
      - "MUST NOT"
    disallowed:
      - "should"
      - "could"
      - "might"
      - "would"
      - "may"
      - "ought"
      - "probably"
      - "possibly"
      - "maybe"

  disallowed_terms:
    - term: "as fast as possible"
      replacement: "within the specified timeout"
    - term: "user friendly"
      replacement: "standard interface"
    - term: "best effort"
      replacement: "up to N retries"
    - term: "etc"
      replacement: "exhaustive list"
    - term: "etc."
      replacement: "exhaustive list"
    - term: "and so on"
      replacement: "exhaustive list"
